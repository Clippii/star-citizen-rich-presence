name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: star-citizen-rich-presence-windows-x64
          path: |
            target/release/star-citizen-rich-presence.exe
            scrp.example.toml
            README.md
            VALIDATION.md
            RELEASE_NOTES.md
            data/content-source.json
            LICENSE
